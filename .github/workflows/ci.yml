name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job configures with LIBPATHIME_REQUIRE_BACKENDS=ON so a runner that
# quietly lost a dependency fails instead of testing three backends, and pins
# CMake so a runner-image refresh cannot change the build overnight.
# 4.2.3: new enough to find Visual Studio on the windows-2025 image (3.31
# could not), and the version the tree is routinely configured with — the
# libhangul <3.10 compatibility request is a deprecation warning there, not
# yet an error.
env:
  CMAKE_VERSION: 4.2.3

jobs:
  linux:
    name: ${{ matrix.name }}
    # ubuntu-24.04 unless the matrix entry says otherwise (the ARM job does).
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            configure: >-
              cmake --preset linux-release
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
              -DLIBPATHIME_BUILD_DEMO=ON
            builddir: build/linux-release
          - name: linux-gcc-debug
            configure: >-
              cmake --preset linux-debug
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
            builddir: build/linux-debug
          - name: linux-clang-release
            configure: >-
              cmake --preset linux-release
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
            builddir: build/linux-release
          - name: linux-static
            # Exercises PATHIME_STATIC and the module_path.cc /proc/self/exe
            # fallback that a shared build never reaches.
            configure: >-
              cmake --preset linux-release
              -DBUILD_SHARED_LIBS=OFF
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
            builddir: build/linux-release
          - name: linux-asan-ubsan
            # The configuration docs/testing.md documents as clean. No preset
            # carries the sanitizers; the flags are the contract.
            configure: >-
              cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
            builddir: build/asan
            # detect_leaks=0 at build time only: anthy's dictionary codegen
            # tools exit without freeing, as build-time programs reasonably do,
            # and LeakSanitizer would fail the build over it. The tests run
            # with leak detection on; anthy.vendor.main is excluded because it
            # is upstream's own program, not leak-clean, left as written.
            build-env: ASAN_OPTIONS=detect_leaks=0
            ctest-args: -E '^anthy\.vendor\.main$'
          - name: linux-uninit
            # Guards the pathime_init_params_t class of bug; docs/testing.md,
            # "Running with uninitialized locals made hostile".
            configure: >-
              cmake -S . -B build/uninit -G Ninja
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
              -DCMAKE_C_FLAGS="-ftrivial-auto-var-init=pattern -g"
              -DCMAKE_CXX_FLAGS="-ftrivial-auto-var-init=pattern -g"
            builddir: build/uninit
          - name: linux-arm64-gcc-release
            # The release ships linux-aarch64 binaries; this is the run that
            # keeps the architecture green between tags rather than
            # discovering problems from one.
            os: ubuntu-24.04-arm
            configure: >-
              cmake --preset linux-release
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
            builddir: build/linux-release
          - name: linux-cmake-floor
            # The one job at the advertised cmake_minimum_required. Everything
            # else pins a modern CMake so runner drift cannot change builds
            # overnight; this run is what makes raising the floor a visible
            # decision instead of silent rot. No preset — presets and the
            # pinned toolchains are deliberately out of scope for the floor.
            cmake-version: 3.21.7
            configure: >-
              cmake -S . -B build/floor -G Ninja -DCMAKE_BUILD_TYPE=Release
              -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
            builddir: build/floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ matrix.cmake-version || env.CMAKE_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev check
      - name: Configure
        run: ${{ matrix.configure }}
      - name: Build
        run: ${{ matrix.build-env }} cmake --build ${{ matrix.builddir }}
      - name: Test
        run: ctest --test-dir ${{ matrix.builddir }} --output-on-failure ${{ matrix.ctest-args }}

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-ninja
            # The Windows job to lean on: parallel, and carries the demo.
            # The link pool serializes link steps only: vcpkg's applocal step
            # runs as part of each link command, copying the same runtime DLLs
            # beside every executable, and two concurrent copies of the same
            # DLL collide ("file is being used by another process"). Compiles
            # stay parallel; applocal itself must stay on, because the
            # build-time tools (the table compiler) load those DLLs too.
            os: windows-2025
            preset: windows-ninja
            configure-args: >-
              -DLIBPATHIME_BUILD_DEMO=ON
              -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link
            ctest-args: ""
          - name: windows-msvc
            # Keeps the Visual Studio generator honest. Serial on purpose —
            # the build preset carries jobs:1; docs/windows-port.md has why.
            # windows-2022, not -2025: the preset pins the Visual Studio 17
            # generator and the 2025 image ships only Visual Studio 18.
            os: windows-2022
            preset: windows-msvc
            configure-args: ""
            ctest-args: -C Release
    steps:
      # The runner images configure core.autocrlf=true, and BUILD.md requires
      # an LF checkout — anthy's dictionary codegen parses tokens with stray
      # CRs otherwise. A .gitattributes here cannot fix it, because the
      # requirement is about the submodules' files and attributes do not cross
      # the submodule boundary. So: before checkout.
      - name: Force LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Resolve vcpkg baseline
        id: vcpkg
        run: echo "rev=$(git -C C:\vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      # restore/save rather than the combined action: the combined form saves
      # only when the whole job succeeds, so a failure after `vcpkg install`
      # throws away a from-source glib build (~25 minutes). Saving immediately
      # after the install keeps it regardless.
      # The exact-rev key rarely hits: the runner fleet rolls image updates
      # gradually, so consecutive runs can land on different vcpkg checkouts.
      # The prefix fallback restores the newest previous tree instead, which
      # makes `vcpkg install` a near-no-op; a fresh exact key is saved for the
      # new rev. Keyed per image label, because the images build with
      # different Visual Studio toolsets.
      - name: Restore vcpkg installed tree
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.rev }}
          restore-keys: vcpkg-${{ matrix.os }}-
      - name: Install pyzy's dependencies
        run: vcpkg install glib:x64-windows sqlite3:x64-windows pkgconf:x64-windows
      - name: Save vcpkg installed tree
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.rev }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: matrix.preset == 'windows-ninja'
        with:
          arch: x64
      - name: Configure
        # VCPKG_ROOT on the step, not the job: vcvars points it at the vcpkg
        # bundled with Visual Studio, and the preset reads it.
        env:
          VCPKG_ROOT: C:\vcpkg
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
          ${{ matrix.configure-args }}
      - name: Build
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure ${{ matrix.ctest-args }}

  # macos-26 is arm64, pinned so a -latest migration cannot change the
  # platform silently. Both link modes; the static job is what runs the
  # _NSGetExecutablePath fallback in module_path.cc. The install step is not
  # redundant with install-consumer: it is the only thing that executes the
  # @loader_path RPATH arm, and macOS is not covered by that Linux job.
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-shared
            configure-args: ""
          - name: macos-static
            configure-args: -DBUILD_SHARED_LIBS=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Install dependencies
        run: brew install ninja glib pkgconf check
      - name: Configure
        run: >-
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLIBPATHIME_BUILD_TESTS=ON -DLIBPATHIME_REQUIRE_BACKENDS=ON
          -DLIBPATHIME_BUILD_DEMO=ON
          ${{ matrix.configure-args }}
      - name: Build
        run: cmake --build build/macos
      - name: Test
        run: ctest --test-dir build/macos --output-on-failure
      - name: Install, consume, package
        run: |
          cmake --install build/macos --prefix "$PWD/stage"
          mv stage moved
          cmake -S examples/install-check -B build/ic -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/moved"
          cmake --build build/ic
          if [ "${{ matrix.name }}" = macos-static ]; then
            cp build/ic/pathime-install-check moved/bin/
            ./moved/bin/pathime-install-check
          else
            ./build/ic/pathime-install-check
          fi
          cpack --config build/macos/CPackConfig.cmake -B pkg
          cpack --config build/macos/CPackConfig.cmake -B pkg \
            -D CPACK_COMPONENTS_ALL="runtime;demo;data" \
            -D CPACK_PACKAGE_FILE_NAME=pathime-demo-ci

  # BUILD.md, "Glyph coverage": two builds of the same commit with the same
  # map produce byte-identical tables. The claim is load-bearing for the
  # checked-in coverage maps, and this job is what enforces it. Tables only —
  # the other backends are off, so the whole job is a couple of minutes; and
  # deliberately no anthy.dic comparison, which is not a documented claim.
  reproducible-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsqlite3-dev
      # BUILD_TESTS because the staging target (pathime-runtime-data) only
      # exists when something in the build tree runs the data.
      - name: Build the tables twice
        run: |
          for b in a b; do
            cmake -S . -B build/repro-$b -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DLIBPATHIME_WITH_HANGUL=OFF -DLIBPATHIME_WITH_ANTHY=OFF \
              -DLIBPATHIME_WITH_PYZY=OFF -DLIBPATHIME_REQUIRE_BACKENDS=ON \
              -DLIBPATHIME_BUILD_TESTS=ON
            cmake --build build/repro-$b --target pathime-runtime-data
          done
      - name: Compare
        run: |
          for b in a b; do
            (cd build/repro-$b && find . -path '*/pathime-data/table/*.db' -print0 \
              | sort -z | xargs -0 sha256sum) > $b.sum
          done
          test "$(wc -l < a.sum)" -eq 5   # the five default tables, found where expected
          diff -u a.sum b.sum
          cat a.sum

  # The install as a consumer meets it: install both link modes, MOVE the
  # prefixes (installing and consuming at the same prefix cannot catch a
  # configure-time-pinned path — the relocation rule BUILD.md states), then
  # build and RUN examples/install-check four ways: find_package and
  # pkg-config, each against the shared and the static install. Running is the
  # point — pathime_has_engine() is what checks that pathime-data/ landed
  # where the library resolves it, and the static consumer resolves from its
  # own binary, so it executes from beside the installed bin/pathime-data.
  # The same job asserts nothing ships the tests or the table compiler.
  install-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev
      - name: Build and install both link modes, then move the prefixes
        run: |
          for mode in shared static; do
            extra=""
            if [ "$mode" = static ]; then extra="-DBUILD_SHARED_LIBS=OFF"; fi
            cmake -S . -B "build/ic-$mode" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DLIBPATHIME_REQUIRE_BACKENDS=ON -DLIBPATHIME_BUILD_TESTS=ON \
              -DLIBPATHIME_BUILD_DEMO=ON \
              -DCMAKE_INSTALL_PREFIX="$PWD/stage/$mode" $extra
            cmake --build "build/ic-$mode"
            cmake --install "build/ic-$mode"
          done
          mv stage moved
      - name: Nothing ships the tests or the table compiler
        run: |
          for mode in shared static; do
            if find "moved/$mode" -name 'pathime-table-compile*' | grep -q .; then
              echo "pathime-table-compile leaked into the $mode install"; exit 1
            fi
            extras=$(ls "moved/$mode/bin" | grep -vE '^(pathime-demo|pathime-data)$' || true)
            if [ -n "$extras" ]; then
              echo "unexpected in $mode bin/: $extras"; exit 1
            fi
          done
      - name: find_package consumers
        run: |
          for mode in shared static; do
            cmake -S examples/install-check -B "build/fp-$mode" -G Ninja \
              -DCMAKE_PREFIX_PATH="$PWD/moved/$mode"
            cmake --build "build/fp-$mode"
          done
          ./build/fp-shared/pathime-install-check
          cp build/fp-static/pathime-install-check moved/static/bin/
          ./moved/static/bin/pathime-install-check
      - name: pkg-config consumers
        run: |
          export PKG_CONFIG_PATH="$PWD/moved/shared/lib/pkgconfig"
          cc examples/install-check/consumer.c \
            $(pkg-config --cflags --libs pathime) -o pc-shared
          LD_LIBRARY_PATH="$PWD/moved/shared/lib" ./pc-shared
          export PKG_CONFIG_PATH="$PWD/moved/static/lib/pkgconfig"
          cc examples/install-check/consumer.c \
            $(pkg-config --cflags --libs --static pathime) -o pc-static
          cp pc-static moved/static/bin/
          ./moved/static/bin/pc-static
