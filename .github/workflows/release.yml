name: Release

# Tag filters match only tag refs — a branch can never trigger this — and the
# pattern admits only version-shaped tags, so a stray `vendor-sync` tag does
# not start a release build. A version-shaped tag that disagrees with the
# version macros in pathime.h still fails the guard step below.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CMAKE_VERSION: 4.2.3

jobs:
  # Two archives per platform-architecture pair, from the component installs —
  # cmake/LibpathimePackage.cmake is the layout's owner, this matrix only runs
  # it. Linux builds on ubuntu-22.04 deliberately: binaries link the build
  # machine's glibc and libstdc++, so the oldest supported image sets the
  # compatibility floor (glibc 2.35), which the release notes state.
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-26
    steps:
      - name: Force LF checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev check
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja glib pkgconf
      - name: Resolve vcpkg baseline
        if: runner.os == 'Windows'
        id: vcpkg
        run: echo "rev=$(git -C C:\vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg installed tree
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.rev }}
          restore-keys: vcpkg-${{ matrix.os }}-
      - name: Install pyzy's dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glib:x64-windows sqlite3:x64-windows pkgconf:x64-windows
      - name: Save vcpkg installed tree
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.rev }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        env:
          VCPKG_ROOT: C:\vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake --preset windows-ninja \
              -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link \
              -DLIBPATHIME_REQUIRE_BACKENDS=ON -DLIBPATHIME_BUILD_DEMO=ON \
              -DLIBPATHIME_BUILD_TESTS=ON
            echo "builddir=build/windows-ninja" >> "$GITHUB_ENV"
          else
            cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DLIBPATHIME_REQUIRE_BACKENDS=ON -DLIBPATHIME_BUILD_DEMO=ON \
              -DLIBPATHIME_BUILD_TESTS=ON
            echo "builddir=build/release" >> "$GITHUB_ENV"
          fi
      - name: The tag names the built version
        shell: bash
        run: |
          built=$(sed -n 's/^set(CPACK_PACKAGE_VERSION "\(.*\)")$/\1/p' \
            "$builddir/CPackConfig.cmake")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "tag v$tag but pathime.h says $built"; exit 1
          fi
      - name: Build
        env:
          VCPKG_ROOT: C:\vcpkg
        shell: bash
        run: cmake --build "$builddir"
      # The binaries being packaged are the binaries being tested — a release
      # is the one build where the extra minutes are always worth it, and for
      # linux-aarch64 this is the only test run the architecture gets.
      - name: Test
        shell: bash
        run: ctest --test-dir "$builddir" --output-on-failure
      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cpack --config "$builddir/CPackConfig.cmake" -B out
          cpack --config "$builddir/CPackConfig.cmake" -B out \
            -D CPACK_COMPONENTS_ALL="runtime;demo;data" \
            -D CPACK_PACKAGE_FILE_NAME="pathime-demo-$ver-${{ matrix.name }}"
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.zip
          if-no-files-found: error

  # The source tarball: generated by tools/make-source-tarball.sh (GitHub's
  # auto-tarball omits submodules and does not build), then proven buildable
  # by configuring, building and testing FROM the extracted tree. Linux,
  # necessarily: the tree carries a symlink Windows extraction can drop.
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev check
      - name: Generate
        run: tools/make-source-tarball.sh -o out
      - name: Build and test from the tarball
        run: |
          mkdir /tmp/from-tarball
          tar -C /tmp/from-tarball --strip-components=1 -xzf out/*.tar.gz
          cmake -S /tmp/from-tarball -B /tmp/from-tarball/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBPATHIME_REQUIRE_BACKENDS=ON -DLIBPATHIME_BUILD_TESTS=ON
          cmake --build /tmp/from-tarball/build
          ctest --test-dir /tmp/from-tarball/build --output-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-tarball
          path: out/*.tar.gz
          if-no-files-found: error

  # A DRAFT release: everything attached and attested, the notes written —
  # publishing stays a human act on the release page.
  publish:
    needs: [binaries, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # SHA256SUMS serves the mundane `sha256sum -c` workflow; the provenance
      # attestation (which also covers the checksum file) is the stronger
      # statement for anyone with the GitHub CLI.
      - name: Checksums
        run: (cd artifacts && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One paragraph per line — hard-wrapping the source injects line
          # breaks into the rendered notes. Licence last, below the build
          # info; a per-release summary paragraph is added by hand on the
          # draft.
          ver="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Two archives per platform: the **library package** for embedders (headers, libraries, CMake and pkg-config files, \`pathime-data/\`) and the standalone **demo package** (unpack, run \`bin/pathime-demo\` inside the unpacked directory). Every archive unpacks into a single top-level directory named after itself. The source tarball carries every submodule at its pinned commit — GitHub's auto-generated "Source code" archives do not, and do not build.

          \`SHA256SUMS\` covers every asset (\`sha256sum -c SHA256SUMS\`); provenance is attested (\`gh attestation verify <asset> -R $GITHUB_REPOSITORY\`).

          **Linux:** built on Ubuntu 22.04 — needs glibc ≥ 2.35, and glib, sqlite3 and libuuid from the system: \`apt install libglib2.0-0 libsqlite3-0 libuuid1\`. **macOS:** arm64; needs glib from Homebrew (\`brew install glib\`) — sqlite3 and the UUID functions come with the system. **Windows:** needs the Visual C++ redistributable; every other dependency ships in the archive.

          **Licence:** every binary archive is GPL-3 as a whole — it ships GPL-3 table databases and the GPL-2 anthy dictionary beside the MIT library and LGPL backends. \`share/doc/pathime/\` inside each archive has the texts, and THIRD-PARTY.md the component-by-component terms and the build flags that produce differently-licensed trees.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "libpathime $ver" \
            --notes-file notes.md \
            artifacts/*
